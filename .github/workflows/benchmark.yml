name: Publish benchmark evidence
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["benchmarks/**", "package*.json", ".github/workflows/benchmark.yml", "app/**", "mockserver/**", "playwright/**"]
permissions:
  contents: read
concurrency:
  group: benchmark-publication
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      prepared: ${{ steps.prepare.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.13.0'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.15.2'
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Run complete benchmark
        id: benchmark
        run: npm run benchmark
        env:
          BENCHMARK_PUBLISH: '0'
      - name: Prepare aggregate even if benchmark failed
        id: prepare
        if: always() && steps.benchmark.outcome != 'skipped'
        run: npm run benchmark:publish
        env:
          BENCHMARK_PUBLISH: '0'
      - name: Transfer only the sanitized aggregate
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: benchmark-aggregate
          path: benchmark-results/dashboard-pending.json
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: benchmark
    if: always() && needs.benchmark.outputs.prepared == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchmark-aggregate
          path: benchmark-results
      - name: Validate and publish the prepared aggregate
        run: python3 benchmarks/dashboard/publish.py --prepared benchmark-results/dashboard-pending.json
        env:
          GH_BENCHMARK_TOKEN: ${{ github.token }}
